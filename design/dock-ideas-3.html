<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dock-Animationen 3</title>
<style>
  @font-face { font-family: "SmallCaps"; src: url("/fonts/smallcaps.ttf") format("truetype"); }
  :root { --acc: #4ade80; --acc-dim: rgba(74, 222, 128, 0.35); --acc-bg: rgba(74, 222, 128, 0.12); }
  html, body { margin: 0; background: #000; color: #fff; font-family: "SmallCaps", monospace; letter-spacing: 0.03em; }
  body { padding: 32px 24px 48px; }
  h1 { font-size: 15px; font-weight: 500; color: #888; margin: 0 0 24px; letter-spacing: 0.1em; }
  .row { display: flex; align-items: center; gap: 28px; padding: 18px 0; border-top: 1px solid #141414; }
  .lab { width: 210px; font-size: 15px; }
  .lab small { display: block; color: #777; font-size: 13px; margin-top: 2px; }
  .d { position: relative; display: flex; gap: 8px; padding: 10px; background: #0c0c0c; border: 1px solid #2a2a2a; perspective: 500px; }
  .b { position: relative; z-index: 1; width: 52px; height: 52px; border: 1px solid transparent; background: none; color: #666;
       display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; font: inherit; box-sizing: border-box; overflow: visible;
       transition: color 200ms, background 250ms, transform 250ms, border-color 250ms, box-shadow 250ms, border-radius 300ms; }
  .b svg { width: 22px; height: 22px; flex: none; }
  .b .ic { display: flex; position: relative; transition: transform 250ms, filter 250ms; }
  .b:hover { color: #aaa; }
  .b.on { color: #fff; }

  /* 36 Schweben */
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .v36.on .ic { animation: float 2.2s ease-in-out infinite; }

  /* 37 Cursor */
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .v37 .cu { position: absolute; bottom: 6px; left: 50%; width: 10px; height: 2px; margin-left: -5px; background: var(--acc); opacity: 0; }
  .v37.on .cu { animation: blink 1s steps(1) infinite; }

  /* 38 Ameisen */
  .v38 .sv { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: 0; transition: opacity 200ms; }
  .v38 .sv rect { fill: none; stroke: var(--acc); stroke-width: 1.5; stroke-dasharray: 4 4; }
  @keyframes ants { to { stroke-dashoffset: -16; } }
  .v38.on .sv { opacity: 1; } .v38.on .sv rect { animation: ants 800ms linear infinite; }

  /* 39 Zwei Hälften */
  .v39 .h1, .v39 .h2 { position: absolute; left: 0; right: 0; height: 50%; border: 1px solid #fff; opacity: 0; transition: transform 300ms cubic-bezier(.22,1,.36,1), opacity 200ms; pointer-events: none; }
  .v39 .h1 { top: 0; border-bottom: 0; transform: translateX(-16px); }
  .v39 .h2 { bottom: 0; border-top: 0; transform: translateX(16px); }
  .v39.on .h1, .v39.on .h2 { opacity: 1; transform: none; }

  /* 40 Fallen */
  @keyframes dropin { 0% { transform: translateY(-30px); opacity: 0; } 60% { transform: translateY(4px); opacity: 1; } 80% { transform: translateY(-2px); } 100% { transform: translateY(0); } }
  .v40.on .ic { animation: dropin 450ms cubic-bezier(.22,1,.36,1); }

  /* 41 Kippen */
  .v41 { transform-style: preserve-3d; }
  .v41.on { transform: rotateX(18deg); background: linear-gradient(#1c1c1c, #0e0e0e); border-color: #2c2c2c; }

  /* 42 Sockel */
  .v42 .pl { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 6px; background: #2a2a2a; border-top: 1px solid #3a3a3a; transform: translateY(14px); opacity: 0; transition: transform 300ms cubic-bezier(.22,1,.36,1), opacity 200ms; }
  .v42.on .pl { transform: none; opacity: 1; }
  .v42.on .ic { transform: translateY(-3px); }

  /* 43 Kreis wird Quadrat */
  .v43 .mo { position: absolute; inset: 4px; background: #1e1e1e; border-radius: 50%; transform: scale(0); transition: transform 300ms cubic-bezier(.22,1,.36,1), border-radius 350ms 120ms; z-index: -1; }
  .v43.on .mo { transform: scale(1); border-radius: 0; }

  /* 44 Seitenlinien */
  .v44 .l, .v44 .r { position: absolute; top: 50%; width: 2px; height: 0; background: var(--acc); transform: translateY(-50%); transition: height 300ms cubic-bezier(.22,1,.36,1); }
  .v44 .l { left: 0; } .v44 .r { right: 0; }
  .v44.on .l, .v44.on .r { height: 100%; }

  /* 45 Pixel-Rahmen */
  .v45.on { outline: 2px dotted var(--acc); outline-offset: -3px; }

  /* 46 Atmender Glow */
  @keyframes breathe { 0%,100% { filter: drop-shadow(0 0 2px var(--acc-dim)); } 50% { filter: drop-shadow(0 0 9px var(--acc)); } }
  .v46.on { color: var(--acc); } .v46.on .ic { animation: breathe 2s ease-in-out infinite; }

  /* 47 Dick */
  .v47 svg { transition: stroke-width 250ms; }
  .v47.on svg { stroke-width: 2.6; }

  /* 48 Lauflicht */
  @keyframes run { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
  .v48 .sp { position: absolute; width: 5px; height: 5px; background: var(--acc); box-shadow: 0 0 6px var(--acc); offset-path: rect(0 0 0 0 round 0); offset-path: path("M26 0 H52 V52 H0 V0 H26"); offset-rotate: 0deg; opacity: 0; }
  .v48.on .sp { animation: run 600ms ease-out forwards; opacity: 1; }

  /* 49 Gummi-Strich */
  @keyframes rubber { 0% { transform: translateX(-50%) scaleX(0); } 50% { transform: translateX(-50%) scaleX(1.9); } 70% { transform: translateX(-50%) scaleX(.8); } 100% { transform: translateX(-50%) scaleX(1); } }
  .v49 .u { position: absolute; bottom: 5px; left: 50%; width: 18px; height: 2px; background: var(--acc); transform: translateX(-50%) scaleX(0); }
  .v49.on .u { animation: rubber 500ms ease-out forwards; }

  /* 50 Grün steigt */
  .v50 .ic2 { position: absolute; inset: 0; display: flex; color: var(--acc); clip-path: inset(100% 0 0 0); transition: clip-path 400ms cubic-bezier(.22,1,.36,1); }
  .v50.on .ic2 { clip-path: inset(0 0 0 0); }

  /* 51 Rahmen mit Lücke */
  .v51 .g { position: absolute; inset: 0; border: 1px solid #fff; border-bottom: 0; opacity: 0; transition: opacity 200ms; pointer-events: none; }
  .v51 .g::before, .v51 .g::after { content: ""; position: absolute; bottom: 0; width: 14px; height: 1px; background: #fff; }
  .v51 .g::before { left: -1px; } .v51 .g::after { right: -1px; }
  .v51.on .g { opacity: 1; }

  /* 52 Diagonal */
  .v52 .dg { position: absolute; inset: 0; background: #1c1c1c; clip-path: polygon(0 0, 0 0, 0 0); transition: clip-path 350ms cubic-bezier(.22,1,.36,1); z-index: -1; }
  .v52.on .dg { clip-path: polygon(0 0, 100% 0, 0 100%); }

  /* 53 Versenken */
  .v53.on { background: #080808; box-shadow: inset 0 2px 6px rgba(0,0,0,.9), inset 0 -1px 0 #222; transform: translateY(1px); }

  /* 54 Lichtsäule */
  .v54 .bm { position: absolute; left: 50%; bottom: 100%; width: 40px; height: 70px; margin-left: -20px; background: linear-gradient(to top, var(--acc-dim), transparent); opacity: 0; transform: scaleY(0); transform-origin: bottom; transition: transform 350ms ease-out, opacity 250ms; pointer-events: none; }
  .v54.on .bm { opacity: 1; transform: scaleY(1); }
  .v54.on { border-top-color: var(--acc); }

  /* 55 Verzauberung */
  @keyframes glint { 0% { transform: translateX(-100%) rotate(20deg); } 100% { transform: translateX(100%) rotate(20deg); } }
  .v55 { overflow: hidden; }
  .v55 .gl { position: absolute; inset: -20px; background: linear-gradient(100deg, transparent 40%, rgba(190,120,255,.35) 50%, transparent 60%); opacity: 0; pointer-events: none; }
  .v55.on { color: #e6d2ff; border-color: #3a2a55; }
  .v55.on .gl { opacity: 1; animation: glint 1.6s linear infinite; }
</style>
</head>
<body>
<h1>Dock-Auswahl · Ideen 36 bis 55</h1>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M9.90 4.53Q12.00 3.00 14.10 4.53L19.03 8.11Q21.13 9.63 20.33 12.11L18.45 17.89Q17.64 20.37 15.04 20.37L8.96 20.37Q6.36 20.37 5.55 17.89L3.67 12.11Q2.87 9.63 4.97 8.11Z"/><path d="M10 15.5q2 1.5 4 0"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M10.9 3.4 Q12 2.8 13.1 3.4 L19.2 6.85 Q20.3 7.5 20.3 8.75 L20.3 15.25 Q20.3 16.5 19.2 17.15 L13.1 20.6 Q12 21.2 10.9 20.6 L4.8 17.15 Q3.7 16.5 3.7 15.25 L3.7 8.75 Q3.7 7.5 4.8 6.85Z"/><path d="M4 7.5 12 12 20 7.5"/><path d="M12 12v9"/><path d="m8 5.2 8 4.5"/><path d="m6.6 11.3 2.4 1.35"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10.5a6 6 0 0 1 12 0v3.9c0 .7.3 1.3.9 1.7l.6.4c.9.6.5 1.9-.6 1.9H5.1c-1.1 0-1.5-1.3-.6-1.9l.6-.4c.6-.4.9-1 .9-1.7z"/><path d="M10 20.5q2 1.4 4 0"/></symbol>
  <symbol id="i-hex" viewBox="0 0 24 24"><path d="M3.38 13.57 Q2.5 12 3.38 10.43 L6.12 5.57 Q7 4 8.8 4 L15.2 4 Q17 4 17.88 5.57 L20.62 10.43 Q21.5 12 20.62 13.57 L17.88 18.43 Q17 20 15.2 20 L8.8 20 Q7 20 6.12 18.43Z"/><path d="m9.75 9 4.5 6"/></symbol>
</svg>
<div id="list"></div>
<script>
  const icons = ["i-home","i-box","i-bell","i-hex"];
  const ideas = [
    [36,"Schweben","Icon hebt und senkt sich langsam"],
    [37,"Cursor","blinkender Strich wie im Terminal"],
    [38,"Ameisen","gestrichelter Rahmen wandert"],
    [39,"Zwei Hälften","Rahmen kommt oben links, unten rechts rein"],
    [40,"Fallen","Icon fällt rein und federt"],
    [41,"Kippen","Button neigt sich nach hinten, 3D"],
    [42,"Sockel","Platte schiebt sich unter das Icon"],
    [43,"Kreis wird Quadrat","Fläche wächst rund und wird eckig"],
    [44,"Seitenlinien","grüne Kanten wachsen links und rechts"],
    [45,"Pixel-Rahmen","gepunkteter Rand, sehr Minecraft"],
    [46,"Atmender Glow","grüner Schein pulsiert"],
    [47,"Dick","Strichstärke des Icons nimmt zu"],
    [48,"Lauflicht","Punkt läuft einmal um den Rand"],
    [49,"Gummi-Strich","Unterstrich schießt über und federt"],
    [50,"Grün steigt","Icon füllt sich von unten mit Grün"],
    [51,"Rahmen mit Lücke","wie ein Reiter, unten offen"],
    [52,"Diagonal","Fläche wischt schräg rein"],
    [53,"Versenken","Button wird reingedrückt"],
    [54,"Lichtsäule","Licht steigt über dem Dock auf"],
    [55,"Verzauberung","lila Schimmer wie verzauberte Items"],
  ];
  const extra = {
    37: '<span class="cu"></span>',
    38: '<svg class="sv" viewBox="0 0 52 52" preserveAspectRatio="none"><rect x="1" y="1" width="50" height="50"/></svg>',
    39: '<span class="h1"></span><span class="h2"></span>',
    42: '<span class="pl"></span>',
    43: '<span class="mo"></span>',
    44: '<span class="l"></span><span class="r"></span>',
    48: '<span class="sp"></span>',
    49: '<span class="u"></span>',
    51: '<span class="g"></span>',
    52: '<span class="dg"></span>',
    54: '<span class="bm"></span>',
    55: '<span class="gl"></span>',
  };
  const svg = (id) => `<svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
  const list = document.getElementById("list");
  for (const [v, name, sub] of ideas) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<div class="lab">${v} · ${name}<small>${sub}</small></div>`;
    const d = document.createElement("div"); d.className = "d d" + v;
    const btns = icons.map((id) => {
      const b = document.createElement("button"); b.className = "b v" + v;
      b.innerHTML = `<span class="ic">${svg(id)}${v === 50 ? `<span class="ic2">${svg(id)}</span>` : ""}</span>` + (extra[v] || "");
      d.appendChild(b); return b;
    });
    let cur = -1;
    const sel = (i) => {
      btns.forEach((b, j) => b.classList.toggle("on", j === i));
      if (cur !== -1) btns[i].querySelectorAll(".ic, .sp, .u").forEach(s => { s.style.animation = "none"; void s.offsetWidth; s.style.animation = ""; });
      cur = i;
    };
    btns.forEach((b, i) => b.addEventListener("click", () => sel(i)));
    sel(0);
    row.appendChild(d); list.appendChild(row);
  }
</script>
</body>
</html>
