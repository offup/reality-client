  <symbol id="i-warn" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-shirt" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></symbol>
</svg>
<div id="grid"></div>
<canvas id="src" style="display:none"></canvas>
<script>
  const sv = (id) => `<svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
  const logo = `<div class="logo"><img src="logo.png" alt=""><div><span>Reality Client</span><small>v0.1.0</small></div></div>`;
  const ms = `<div class="ms"><i><b></b><b></b><b></b><b></b></i>Mit Microsoft anmelden</div>`;
  const ghost = (t = "Offline mit Spielernamen", ic = "i-user") => `<div class="ghost">${sv(ic)}${t}</div>`;
  const skin = (cls = "") => `<img class="skin ${cls}" data-skin alt="">`;
  const pname = `<div class="pname">lettner</div>`;
  const dock = (o = {}) => `<div class="dock">
    <div class="it on">${sv("i-home")}<span class="ul" style="transform:translateX(15px)"></span></div><div class="it">${sv("i-box")}</div>
    <div class="lg">${o.left !== undefined ? o.left : `<div class="add${o.active ? " on" : ""}"><span class="bx">${o.spin ? '<span class="spin"></span>' : sv("i-plus")}</span></div>`}${o.mid !== undefined ? o.mid : `<div class="lm">${o.fill ? '<span class="fill"></span>' : ""}<span class="lt">${o.title || "Launch"}</span><span class="ls">${o.sub || "1.21.4"}</span></div><div class="la">${sv("i-chev")}</div>`}</div>
    <div class="it">${sv("i-bell")}</div><div class="it">${sv("i-hex")}</div></div>`;
  const headTile = `<div class="tile"><span class="face"></span><span class="on-dot"></span></div>`;
  const qr = () => { let h = ""; const f = (r, c) => (r < 7 && c < 7) || (r < 7 && c > 17) || (r > 17 && c < 7); const fin = (r, c) => { const rr = r % 18 < 7 ? r % 18 : r - 18, cc = c % 18 < 7 ? c % 18 : c - 18; const a = rr, b = cc; return a === 0 || a === 6 || b === 0 || b === 6 || (a >= 2 && a <= 4 && b >= 2 && b <= 4); }; let s = 7; for (let r = 0; r < 25; r++) for (let c = 0; c < 25; c++) { let on; if (f(r, c)) { const rr = r > 17 ? r - 18 : r, cc = c > 17 ? c - 18 : c; on = rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4); } else { s = (s * 1103515245 + 12345) & 0x7fffffff; on = (s >> 8) % 100 < 45; } h += `<i class="${on ? "" : "w"}"></i>`; } return h; };
  const px = (() => { let h = ""; const pts = [[560,170],[700,190],[520,300],[760,320],[590,520],[690,540],[480,420],[800,440]]; for (const [x, y] of pts) h += `<span class="px" style="left:${x}px;top:${y}px;opacity:${.4 + Math.random() * .6}"></span>`; return h; })();
  const ideas = [
    ["7 · Browser im Fenster", "Die Microsoft-Seite öffnet sich als Overlay in der App statt im externen Browser. Oben eine kleine Adressleiste, damit man sieht, dass es echt ist.",
      logo + skin("dim") + dock({ active: 1 }) + `<div class="panel web"><div class="bar">${sv("i-lock")}<div class="url">login.live.com/oauth20_authorize.srf</div>${sv("i-x")}</div><div class="pg"><div class="cardw"><div class="mslogo"><i class="ms" style="padding:0;height:auto;background:none"><i><b></b><b></b><b></b><b></b></i></i>Microsoft</div><h3>Anmelden</h3><div class="inp">E-Mail, Telefon oder Skype</div><a>Kein Konto? Erstellen Sie jetzt eins!</a><div class="btn">Weiter</div></div></div></div>`],
    ["8 · QR-Code", "Mit dem Handy scannen, dort anmelden, fertig. Daneben der Code zum Abtippen für alle ohne Handy.",
      logo + dock({ active: 1 }) + `<div class="qrwrap"><div class="qr">${qr()}</div><div class="txt"><div class="ttl">Mit dem Handy anmelden</div><div class="copy">Scanne den Code mit der Kamera. Du landest direkt bei Microsoft und bist in zehn Sekunden drin.</div><div class="or">oder</div><div class="copy">Code <b style="color:#fff;font-family:var(--mc)">AB7K-QX9F</b> auf microsoft.com/link eingeben</div></div></div>`],
    ["9 · Assistent in Schritten", "Drei Schritte oben sichtbar: Anmelden, Xbox-Profil prüfen, Minecraft-Profil laden. Man sieht immer, wo man gerade steht und was noch kommt.",
      logo + skin("dim") + dock({ active: 1 }) + `<div class="dim"></div><div class="panel wiz"><div class="steps"><div class="st done"><b>✓</b>Microsoft</div><div class="st cur"><b>2</b>Xbox-Profil</div><div class="st"><b>3</b>Minecraft</div></div><div class="body"><div class="ttl">Xbox-Profil wird geprüft</div><div class="copy">Wir prüfen, ob dein Konto ein Xbox-Profil hat. Das dauert nur einen Moment.</div><div style="display:flex;align-items:center;gap:12px;font-family:var(--ui);font-size:13px;color:#aaa;letter-spacing:0"><span class="spin"></span>Verbinde mit Xbox Live …</div></div></div>`],
    ["10 · Nur ein Toast", "Klick öffnet den Browser, in der App erscheint nur eine schmale Meldung über dem Dock mit Spinner und Abbrechen. Nichts wird blockiert.",
      logo + skin("dim") + dock({ spin: 1 }) + `<div class="toast"><span class="spin"></span>Browser geöffnet, warte auf Anmeldung …<span class="lnk">Abbrechen</span></div>`],
    ["11 · Launch wird zur Ladeleiste", "Der Launch-Knopf selbst zeigt den Fortschritt: Im Plus dreht ein Spinner, hinter dem Text füllt sich die Fläche.",
      logo + skin("dim") + dock({ spin: 1, fill: 1, title: "Anmelden", sub: "warte auf Microsoft" })],
    ["12 · Spieler füllt sich", "Die graue Silhouette bekommt von unten her Farbe, während der Login läuft. Bei 100 % steht der Skin.",
      logo + dock({ spin: 1 }) + `<div class="fillwrap"><img class="sil" data-skin alt=""><img class="col" data-skin alt=""><span class="ln"></span><span class="pct">58 %</span></div>`],
    ["13 · Account-Karten", "Wie bei Streaming-Diensten: Wer spielt? Karten für jeden Account, eine gestrichelte für Neu. Klick auf eine Karte wählt und schließt.",
      logo + dock({ active: 1 }) + `<div class="cards"><div class="cardp cur"><span class="face lg"></span>lettner</div><div class="cardp"><span class="face lg" style="filter:hue-rotate(150deg)"></span>lettner_alt</div><div class="cardp new">${sv("i-plus")}Neu</div></div>`],
    ["14 · Dropdown mit drei Wegen", "Menü über dem Plus: Microsoft, Offline, und Import aus anderen Launchern. Mit Icons, Hover-Zeile hell.",
      logo + skin() + dock({ active: 1 }) + `<div class="dd"><div class="row hv">${sv("i-lock")}Mit Microsoft anmelden</div><div class="row">${sv("i-user")}Offline mit Spielernamen</div><div class="sep"></div><div class="row">${sv("i-import")}Aus anderem Launcher importieren</div></div>`],
    ["15 · Import-Assistent", "Die App findet Accounts, die in Modrinth, Prism oder dem offiziellen Launcher schon angemeldet sind, und bietet sie zum Übernehmen an.",
      logo + skin("dim") + dock({ active: 1 }) + `<div class="dim"></div><div class="panel dlg" style="width:520px"><span class="x">${sv("i-x")}</span><div class="ttl">Gefundene Accounts</div><div class="copy">Diese Accounts sind auf deinem PC schon angemeldet. Übernehmen spart den Login.</div><div class="row"><span class="face"></span>lettner<span class="tag">Modrinth App</span><span class="meta">Übernehmen</span></div><div class="row"><span class="face" style="filter:hue-rotate(150deg)"></span>lettner_alt<span class="tag">Prism</span><span class="meta">Übernehmen</span></div><div class="copy" style="text-align:center;margin-top:6px">oder <span style="color:#fff">neu anmelden</span></div></div>`],
    ["16 · Offline-Eingabe im Dock", "Für den Offline-Weg: Das Plus wird zum Eingabefeld direkt in der Launch-Gruppe, Haken bestätigt. Kein Dialog.",
      logo + skin("dim") + dock({ active: 1, mid: `<div class="inp"><div class="fld">lett<i></i></div><div class="ok">${sv("i-check")}</div></div>` })],
    ["17 · Willkommensbildschirm", "Beim allerersten Start: kein Dock, nur Logo, Begrüßung und der Login. Erst danach erscheint die normale Oberfläche.",
      `<div class="welcome"><img src="logo.png" alt=""><div class="ttl">Willkommen bei Reality</div><div class="copy" style="max-width:380px">Melde dich an, damit dein Skin, deine Freunde und deine Server bereit sind.</div>${ms}<div class="later">Später, erstmal umschauen</div></div>`],
    ["18 · Spotlight", "Wenn man ohne Account auf Launch klickt: Alles wird dunkel, nur das Plus bleibt hell, mit Hinweis. Lenkt den Blick, ohne zu schimpfen.",
      logo + skin() + dock() + `<div class="spot"></div><div class="tip">Zuerst einen Account hinzufügen</div>`],
    ["19 · Kontextmenü", "Kompaktes Menü wie bei Rechtsklick, direkt am Plus, mit Tastenkürzeln. Für Leute, die es schnell mögen.",
      logo + skin() + dock({ active: 1 }) + `<div class="ctx"><div class="row">${sv("i-lock")}Microsoft<span class="k">Strg+L</span></div><div class="row">${sv("i-user")}Offline<span class="k">Strg+O</span></div><div class="sep"></div><div class="row">${sv("i-import")}Importieren</div></div>`],
    ["20 · Panel von unten", "Ein Blatt schiebt sich hinter dem Dock hoch, mit den Optionen nebeneinander. Fühlt sich wie am Handy an, das Dock bleibt oben drauf.",
      logo + skin("dim") + dock({ active: 1 }) + `<div class="bsheet"><span class="grab"></span><div class="ttl">Account hinzufügen</div><div class="copy">Wähle, wie du dich anmelden willst.</div><div class="opts">${ms}${ghost()}</div></div>`],
    ["21 · Fehlerfall", "So sieht es aus, wenn der Login schiefgeht: rote Kante, klare Meldung, was zu tun ist, und Erneut versuchen. Kein Technik-Kauderwelsch.",
      logo + skin("dim") + dock({ active: 1 }) + `<div class="dim"></div><div class="panel dlg err"><span class="x">${sv("i-x")}</span><div class="ttl">Anmeldung fehlgeschlagen</div><div class="msg">${sv("i-warn")}<span>Dieses Microsoft-Konto besitzt kein Minecraft: Java Edition. Melde dich mit dem Konto an, mit dem du das Spiel gekauft hast.</span></div>${ms.replace("Mit Microsoft anmelden", "Mit anderem Konto versuchen")}<div class="copy" style="text-align:center">Hilfe bei Login-Problemen</div></div>`],
    ["22 · Erfolgsmoment", "Nach dem Login: Der Skin ploppt rein, der Name erscheint, ein paar Pixel fliegen, unten ein kurzer Gruß. Das Plus ist jetzt dein Kopf.",
      logo + pname + skin() + px + dock({ left: headTile }) + `<div class="toast ok"><span class="chk">${sv("i-check")}</span>Willkommen zurück, lettner</div>`],
    ["23 · Im Versions-Pfeil", "Der Pfeil neben Launch öffnet zwei Spalten: links Accounts, rechts Versionen. Ein Menü für beides, kein eigenes Plus nötig.",
      logo + pname + skin() + dock({ left: headTile }) + `<div class="two"><div class="col"><div class="hd">ACCOUNT</div><div class="row hv"><span class="face"></span>lettner</div><div class="row"><span class="face" style="filter:hue-rotate(150deg)"></span>lettner_alt</div><div class="row" style="color:#888">${sv("i-plus")}Hinzufügen</div></div><div class="col"><div class="hd">VERSION</div><div class="row hv"><span class="ver">1.21.4</span>Neueste</div><div class="row"><span class="ver">1.20.1</span></div><div class="row"><span class="ver">1.8.9</span>PvP</div></div></div>`],
    ["24 · Profilkarte am Kopf", "Nach dem Login: Hover oder Klick auf den Kopf zeigt eine kleine Karte mit Name, Kurz-ID, Skin ändern und Abmelden.",
      logo + pname + skin() + dock({ left: headTile }) + `<div class="prof"><div class="top"><span class="face md"></span><div><div class="nm">lettner</div><div class="id">069a79f4 · Microsoft</div></div></div><div class="acts">${ghost("Skin ändern", "i-shirt")}${ghost("Abmelden", "i-out")}</div></div>`],
    ["25 · Zwei Spalten mit Vorschau", "Links der Skin auf eigenem Raster, rechts was man vom Login hat und die Knöpfe. Wie eine kleine Verkaufsseite, aber in der App.",
      logo + dock({ active: 1 }) + `<div class="dim"></div><div class="panel twocol"><div class="art"><img data-skin alt=""></div><div class="side"><div class="ttl">Dein Account</div><ul><li>Dein Skin und dein Cape</li><li>Auf allen Servern spielen</li><li>Freunde sehen, wer online ist</li></ul>${ms}${ghost()}</div></div>`],
    ["26 · Terminal-Stil", "Für die Nerds: Der Login läuft als Log-Zeilen ab, jede Stufe wird abgehakt. Transparent, was gerade passiert.",
      logo + dock({ spin: 1 }) + `<div class="term"><div><span class="ok">✓</span> Browser geöffnet</div><div><span class="ok">✓</span> Microsoft-Token erhalten</div><div><span class="ok">✓</span> Xbox Live angemeldet</div><div><span class="ok">✓</span> XSTS-Token geprüft</div><div><span class="wh">›</span> Minecraft-Profil wird geladen <span class="cur"></span></div><div style="color:#444">  Profil, Skin, Cape</div></div>`],
  ];
  const grid = document.getElementById("grid");
  for (const [t, s, html] of ideas) {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="frame"><div class="win">${html}</div></div><div class="lab">${t}<small>${s}</small></div>`;
    grid.appendChild(c);
  }
  // Skin einmal in 3D rendern, dann als Bild in alle Fenster
  (async () => {
    const canvas = document.getElementById("src");
    const viewer = new skinview3d.SkinViewer({ canvas, width: 640, height: 840, preserveDrawingBuffer: true });
    await viewer.loadSkin("skin.png");
    viewer.zoom = 0.85;
    viewer.playerObject.rotation.y = -0.35;
    viewer.playerObject.skin.leftArm.rotation.x = 0.25; viewer.playerObject.skin.rightArm.rotation.x = -0.25;
    viewer.playerObject.skin.leftLeg.rotation.x = -0.2; viewer.playerObject.skin.rightLeg.rotation.x = 0.2;
    viewer.render();
    const url = canvas.toDataURL();
    for (const img of document.querySelectorAll("img[data-skin]")) img.src = url;
  })();
</script>
</body>
</html>
