<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Background options · ideas</title>
<style>
  @font-face { font-family: "SmallCaps"; src: url("/fonts/smallcaps.ttf") format("truetype"); }
  @font-face { font-family: "MinecraftTen"; src: url("/fonts/minecraft.woff2") format("woff2"); }
  :root { --sc: "SmallCaps", monospace; --mc: "MinecraftTen", sans-serif; --ui: "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; background: #000; color: #fff; font-family: var(--sc); letter-spacing: .03em; }
  body { padding: 28px 24px 48px; }
  h1 { font-size: 15px; font-weight: 500; color: #888; margin: 0 0 6px; letter-spacing: .1em; }
  .note { font-family: var(--ui); font-size: 13px; color: #666; margin: 0 0 24px; letter-spacing: 0; }
  .idea { margin-bottom: 34px; }
  .lab { font-size: 15px; margin: 10px 0 0; }
  .lab small { display: block; color: #777; font-size: 12px; margin-top: 3px; font-family: var(--ui); letter-spacing: 0; max-width: 1100px; }

  /* real-size crop of the settings page: second card row, the bar, the dock top */
  .p { position: relative; width: 1280px; height: 430px; overflow: hidden; background: #0a0a0a; border: 1px solid #222; box-sizing: border-box; }
  .cards { position: absolute; left: 110px; right: 110px; top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { border: 1px solid #2a2a2a; background: #0c0c0c; position: relative; }
  .card.sel { border-color: #fff; box-shadow: inset 0 0 0 1px #fff; }
  .card .pv { height: 150px; background: #0a0a0a center / cover; border-bottom: 1px solid #1c1c1c; position: relative; overflow: hidden; }
  .card .nm { padding: 14px; font-size: 15px; letter-spacing: .08em; }
  .chk { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; }
  .chk svg { width: 13px; height: 13px; }
  .grid-pv { background-image: linear-gradient(var(--line, #1c1c1c) 1px, transparent 1px), linear-gradient(90deg, var(--line, #1c1c1c) 1px, transparent 1px) !important; background-size: 16px 16px !important; }
  .card .pv.photo { background: linear-gradient(180deg, #1b2440 0%, #3b3256 38%, #b0566a 62%, #e39a62 74%, #2a1c22 75%, #120d12 100%); }
  .card .pv.photo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: repeating-linear-gradient(90deg, #160f15 0 22px, #1d141b 22px 30px); clip-path: polygon(0 40%, 8% 20%, 15% 45%, 24% 10%, 33% 38%, 45% 5%, 55% 35%, 66% 15%, 75% 40%, 86% 12%, 100% 30%, 100% 100%, 0 100%); }

  /* the bar under the cards (dock style) */
  .bar { position: absolute; left: 50%; transform: translateX(-50%); top: 248px; display: flex; align-items: center; padding: 10px 4px; background: #0c0c0c; border: 1px solid #2a2a2a; white-space: nowrap; }
  .tool { display: flex; align-items: center; gap: 14px; height: 34px; padding: 0 18px; }
  .tool + .tool { border-left: 1px solid #2a2a2a; }
  .tl { font-size: 13px; letter-spacing: .12em; color: #bbb; }
  .tl.on { color: #fff; }
  .sw-toggle { width: 44px; height: 24px; border: 1px solid #444; background: #141414; position: relative; box-sizing: border-box; }
  .sw-toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #666; }
  .sw-toggle.on { border-color: #fff; background: #1a1a1a; } .sw-toggle.on::after { left: 23px; background: #fff; }
  .chip { width: 22px; height: 22px; border: 1px solid rgba(255,255,255,.25); box-sizing: border-box; }
  .chev { color: #888; font-family: var(--ui); font-size: 11px; }
  .tool.hv { background: #161616; }
  .slider { position: relative; width: 120px; height: 2px; background: #333; }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  .slider b { position: absolute; top: -6px; width: 14px; height: 14px; margin-left: -7px; background: #fff; }
  .val { font-family: var(--ui); font-size: 13px; color: #ddd; letter-spacing: 0; min-width: 34px; }
  .btn { padding: 0 12px; height: 30px; display: flex; align-items: center; gap: 8px; border: 1px solid #2e2e2e; font-size: 12px; letter-spacing: .1em; color: #ddd; }

  /* popover above the bar */
  .pop { position: absolute; padding: 12px; background: #0f0f0f; border: 1px solid #2e2e2e; }
  .pop .ttl { font-size: 11px; letter-spacing: .14em; color: #777; margin: 0 0 10px; }
  .sws { display: grid; grid-template-columns: repeat(6, 26px); gap: 8px; }
  .sw { width: 26px; height: 26px; border: 1px solid #333; box-sizing: border-box; }
  .sw.sel { outline: 2px solid #fff; outline-offset: 2px; }
  .sw.plus { border: 1px dashed #555; display: flex; align-items: center; justify-content: center; color: #aaa; font-family: var(--ui); font-size: 15px; }
  .hue { margin-top: 12px; height: 12px; position: relative; background: linear-gradient(90deg, #ff3b3b, #ffb23b, #e8ff3b, #3bff6a, #3bf5ff, #3b6aff, #b03bff, #ff3bb0, #ff3b3b); }
  .hue b { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 0 1px #000; }
  .tip { position: absolute; width: 10px; height: 10px; background: #0f0f0f; border-right: 1px solid #2e2e2e; border-bottom: 1px solid #2e2e2e; transform: rotate(45deg); }

  /* upload card */
  .upload .pv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1px dashed #444; border-width: 0 0 1px; color: #aaa; }
  .upload .plus { width: 40px; height: 40px; border: 1px dashed #666; display: flex; align-items: center; justify-content: center; font-family: var(--ui); font-size: 22px; color: #ddd; }
  .upload .hint { font-family: var(--ui); font-size: 12px; letter-spacing: 0; color: #777; }
  .upload { border-style: dashed; border-color: #444; }
  .upload.hv { border-color: #888; background: #111; }
  .cardbtns { z-index: 2; position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .cardbtns span { padding: 5px 9px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); font-family: var(--ui); font-size: 11px; letter-spacing: 0; }

  .dockstub { position: absolute; left: 50%; transform: translateX(-50%); bottom: -40px; width: 592px; height: 74px; background: #0c0c0c; border: 1px solid #2a2a2a; }
  .cur { position: absolute; width: 14px; height: 20px; z-index: 5; }
</style>
</head>
<body>
<h1>Background options · ideas · real size</h1>
<p class="note">A crop of Settings → Background at 1:1 (Gradient removed, so the second row is Ghost fibers and the new image slot): the bar under the cards and the top of the dock.</p>
<div id="list"></div>
<script>
  const check = `<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>`;
  const cur = (x, y) => `<svg class="cur" style="left:${x}px;top:${y}px" viewBox="0 0 14 20"><path d="M1 1v15l4-4 3 7 2.5-1-3-7h5.5z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  const COLORS = ["#16222e", "#1f1633", "#0f2a1f", "#2a1818", "#2a2410", "#89cff0"];
  const sws = (sel = 5) => `<div class="sws">${COLORS.map((c, i) => `<span class="sw${i === sel ? " sel" : ""}" style="background:${c}"></span>`).join("")}</div>`;
  const card = (name, pv, sel = false, extra = "") => `<div class="card${sel ? " sel" : ""}"><div ${pv.includes("class=") ? pv : `class="pv" ${pv}`}>${sel ? check : ""}${extra}</div><div class="nm">${name}</div></div>`;
  const ascii = `style="background-image:url(/previews/ascii.webp)"`;
  const fibers = `style="background-image:url(/previews/ghostfibers.webp)"`;
  const uploadEmpty = (hv = false) => `<div class="card upload${hv ? " hv" : ""}"><div class="pv"><span class="plus">+</span><span class="hint">PNG, JPG or GIF · drop or click</span></div><div class="nm">YOUR IMAGE</div></div>`;

  const ideas = [
    ["1 · Color chip, palette pops up above",
      "The bar keeps only a small color chip. Hovering it opens the palette right above the bar: the six presets, the custom color and a rainbow strip. Moving the mouse away closes it.",
      `<div class="cards">${card("GHOST FIBERS", fibers, true)}${uploadEmpty()}</div>
       <div class="pop" style="left:290px;top:132px;width:210px"><div class="ttl">COLOR</div>${sws()}<div class="hue"><b style="left:54%"></b></div></div>
       <span class="tip" style="left:640px;top:238px"></span>
       <div class="bar"><div class="tool hv"><span class="tl on">COLOR</span><span class="chip" style="background:#89cff0"></span><span class="chev">▲</span></div></div>
       ${cur(660, 262)}<div class="dockstub"></div>`],
    ["2 · Grid gets colors too",
      "Grid uses the same color setting: the lines take on the chosen color, softly. The bar shows Moving grid and the color chip side by side.",
      `<div class="cards">${card("ASCII", ascii)}${card("GHOST FIBERS", fibers)}${card("GRID", `class="pv grid-pv" style="--line:#89cff044"`, true)}</div>
       <div class="bar"><div class="tool"><span class="tl">MOVING GRID</span><span class="sw-toggle on"></span></div><div class="tool"><span class="tl">COLOR</span><span class="chip" style="background:#89cff0"></span><span class="chev">▲</span></div></div>
       <div class="dockstub"></div>`],
    ["3 · Upload card in the free slot",
      "The empty sixth slot becomes \"Your image\": click or drop a file. The image is copied into the launcher's folder, so it keeps working even if you delete the original.",
      `<div class="cards">${card("GHOST FIBERS", fibers)}${uploadEmpty(true)}</div>
       <div class="bar"><div class="tool"><span class="tl">COLOR</span><span class="chip" style="background:#89cff0"></span><span class="chev">▲</span></div></div>
       ${cur(1000, 120)}<div class="dockstub"></div>`],
    ["4 · Your image selected",
      "After uploading, the card shows the image with Change and Remove. The bar switches to what fits a picture: Darken (so the player stays readable) and Blur.",
      `<div class="cards">${card("GHOST FIBERS", fibers)}${card("YOUR IMAGE", `class="pv photo"`, true, `<div class="cardbtns"><span>Change</span><span>Remove</span></div>`)}</div>
       <div class="bar"><div class="tool"><span class="tl">DARKEN</span><span class="slider"><i style="width:40%"></i><b style="left:40%"></b></span><span class="val">40%</span></div><div class="tool"><span class="tl">BLUR</span><span class="slider"><i style="width:20%"></i><b style="left:20%"></b></span><span class="val">20%</span></div></div>
       <div class="dockstub"></div>`],
    ["5 · Palette always visible, one line",
      "No popover: the bar shows label, presets, custom and a short rainbow strip in one row. Everything one click away, but the bar gets wider.",
      `<div class="cards">${card("GHOST FIBERS", fibers, true)}${uploadEmpty()}</div>
       <div class="bar"><div class="tool"><span class="tl">COLOR</span>${sws().replace('class="sws"', 'class="sws" style="display:flex;gap:8px"').replace("</div>", '<span class="sw plus">+</span></div>')}<span class="hue" style="margin:0;width:110px;display:block"><b style="left:54%"></b></span></div></div>
       <div class="dockstub"></div>`],
  ];

  const list = document.getElementById("list");
  const q = new URLSearchParams(location.search);
  const only = Number(q.get("n") || 0);
  ideas.forEach(([t, s, html], i) => {
    if (only && only !== i + 1) return;
    const d = document.createElement("div");
    d.className = "idea";
    d.innerHTML = `<div class="p">${html}</div><div class="lab">${t}<small>${s}</small></div>`;
    list.appendChild(d);
  });
</script>
</body>
</html>
