<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dock-Animationen 4</title>
<style>
  @font-face { font-family: "SmallCaps"; src: url("/fonts/smallcaps.ttf") format("truetype"); }
  :root { --acc: #4ade80; --acc-dim: rgba(74, 222, 128, 0.35); --spring: cubic-bezier(.34,1.45,.64,1); --soft: cubic-bezier(.22,1,.36,1); }
  html, body { margin: 0; background: #000; color: #fff; font-family: "SmallCaps", monospace; letter-spacing: 0.03em; }
  body { padding: 32px 24px 48px; }
  h1 { font-size: 15px; font-weight: 500; color: #888; margin: 0 0 24px; letter-spacing: 0.1em; }
  .row { display: flex; align-items: center; gap: 28px; padding: 18px 0; border-top: 1px solid #141414; }
  .lab { width: 210px; font-size: 15px; }
  .lab small { display: block; color: #777; font-size: 13px; margin-top: 2px; }
  .d { position: relative; display: flex; gap: 8px; padding: 10px; background: #0c0c0c; border: 1px solid #2a2a2a; perspective: 600px; }
  .b { position: relative; z-index: 1; width: 52px; height: 52px; border: 1px solid transparent; background: none; color: #6a6a6a;
       display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; font: inherit; box-sizing: border-box;
       transition: color 180ms, background 220ms, transform 300ms var(--spring), border-color 220ms, box-shadow 220ms, width 320ms var(--spring), opacity 220ms, filter 220ms; }
  .b svg { width: 22px; height: 22px; flex: none; }
  .b .ic { display: flex; transition: transform 300ms var(--spring), filter 220ms, opacity 220ms; }
  .b .lb { display: none; font-size: 13px; color: #fff; white-space: nowrap; }
  .b:hover { color: #b0b0b0; }
  .b.on { color: #fff; }

  /* 56 Leise */
  .v56.on { background: #161616; border-color: #262626; }

  /* 57 Lichtfleck folgt der Maus */
  .v57 { background: radial-gradient(90px circle at var(--mx, -100px) var(--my, -100px), rgba(255,255,255,.09), transparent 60%); }
  .v57.on { border-color: #2c2c2c; }

  /* 58 Magnet */
  .v58 .ic { transition: transform 120ms ease-out; }
  .v58.on { background: #141414; }

  /* 59 Feder-Zoom */
  .v59.on .ic { transform: scale(1.18); }

  /* 60 Glas-Kante */
  .v60.on { background: linear-gradient(rgba(255,255,255,.07), rgba(255,255,255,.02)); border-color: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.5); }

  /* 61 Segment */
  .d61 .sl { position: absolute; top: 10px; left: 0; width: 52px; height: 52px; background: #1e1e1e; border: 1px solid #2a2a2a; box-sizing: border-box; transition: transform 380ms var(--spring); }

  /* 62 Gleitender Strich */
  .d62 .ul { position: absolute; bottom: 7px; left: 0; width: 22px; height: 2px; background: var(--acc); transition: transform 380ms var(--spring); }

  /* 63 Scharfstellen */
  .v63.on .ic { animation: sharpen 350ms ease-out; }
  @keyframes sharpen { 0% { filter: blur(5px); opacity: .3; } 100% { filter: blur(0); opacity: 1; } }

  /* 64 Gestaffelt abdunkeln */
  .d64 .b:not(.on) { color: #3d3d3d; }
  .d64 .b:nth-child(1) { transition-delay: 0ms; } .d64 .b:nth-child(2) { transition-delay: 40ms; } .d64 .b:nth-child(3) { transition-delay: 80ms; } .d64 .b:nth-child(4) { transition-delay: 120ms; }
  .d64 .b.on { transition-delay: 0ms; color: #fff; }

  /* 65 Insel */
  .v65 { gap: 10px; }
  .v65 .lb { display: block; max-width: 0; overflow: hidden; opacity: 0; transition: max-width 320ms var(--spring), opacity 180ms 80ms; }
  .v65.on { width: auto; padding: 0 18px; background: #181818; border-color: #262626; }
  .v65.on .lb { max-width: 140px; opacity: 1; }

  /* 66 Neigung */
  .v66 { transform-style: preserve-3d; transition: transform 120ms ease-out; }
  .v66.on { background: #141414; border-color: #222; }

  /* 67 Erhoben */
  .v67.on { background: #1a1a1a; border-color: #2a2a2a; box-shadow: 0 6px 14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); transform: translateY(-2px); }

  /* 68 Fokus-Ring */
  .v68.on { box-shadow: 0 0 0 2px #0c0c0c, 0 0 0 4px rgba(255,255,255,.28); }

  /* 69 Verlaufsrahmen */
  .v69 .gb { position: absolute; inset: -1px; padding: 1px; background: linear-gradient(135deg, var(--acc), transparent 60%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 250ms; pointer-events: none; }
  .v69.on .gb { opacity: 1; }

  /* 70 Kräftiger */
  .v70 svg { transition: stroke-width 220ms, transform 300ms var(--spring); }
  .v70.on svg { stroke-width: 2.3; transform: translateY(-1px); }

  /* 71 Warm */
  .d71 .b { color: #5c6168; }
  .d71 .b.on { color: #fff7ea; filter: drop-shadow(0 0 3px rgba(255,235,200,.45)); }

  /* 72 Tooltip */
  .v72 .tt { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 6px); background: #fff; color: #000; font-size: 12px; padding: 4px 8px; white-space: nowrap; opacity: 0; transition: opacity 180ms, transform 260ms var(--spring); pointer-events: none; }
  .v72 .tt::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: #fff; }
  .v72.on .tt { opacity: 1; transform: translate(-50%, 0); }
  .v72.on { background: #141414; }

  /* 73 Geisterspur */
  .d73 .sl { position: absolute; top: 10px; left: 0; width: 52px; height: 52px; background: #1e1e1e; transition: transform 320ms var(--soft); }
  .d73 .gh { position: absolute; top: 10px; left: 0; width: 52px; height: 52px; background: #1e1e1e; opacity: .6; animation: ghost 450ms ease-out forwards; pointer-events: none; }
  @keyframes ghost { to { opacity: 0; transform: scale(.85); } }

  /* 74 Taste */
  .v74.on { background: #161616; border-color: #262626; }
  .v74.on .ic { animation: press 320ms var(--spring); }
  @keyframes press { 0% { transform: scale(.86); } 100% { transform: scale(1); } }

  /* 75 Ladebalken */
  .d75 .pb { position: absolute; bottom: 7px; left: 10px; width: 0; height: 2px; background: var(--acc); transition: width 260ms var(--soft), left 260ms var(--soft); }
</style>
</head>
<body>
<h1>Dock-Auswahl · Ideen 56 bis 75 · modern</h1>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M9.90 4.53Q12.00 3.00 14.10 4.53L19.03 8.11Q21.13 9.63 20.33 12.11L18.45 17.89Q17.64 20.37 15.04 20.37L8.96 20.37Q6.36 20.37 5.55 17.89L3.67 12.11Q2.87 9.63 4.97 8.11Z"/><path d="M10 15.5q2 1.5 4 0"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M10.9 3.4 Q12 2.8 13.1 3.4 L19.2 6.85 Q20.3 7.5 20.3 8.75 L20.3 15.25 Q20.3 16.5 19.2 17.15 L13.1 20.6 Q12 21.2 10.9 20.6 L4.8 17.15 Q3.7 16.5 3.7 15.25 L3.7 8.75 Q3.7 7.5 4.8 6.85Z"/><path d="M4 7.5 12 12 20 7.5"/><path d="M12 12v9"/><path d="m8 5.2 8 4.5"/><path d="m6.6 11.3 2.4 1.35"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10.5a6 6 0 0 1 12 0v3.9c0 .7.3 1.3.9 1.7l.6.4c.9.6.5 1.9-.6 1.9H5.1c-1.1 0-1.5-1.3-.6-1.9l.6-.4c.6-.4.9-1 .9-1.7z"/><path d="M10 20.5q2 1.4 4 0"/></symbol>
  <symbol id="i-hex" viewBox="0 0 24 24"><path d="M3.38 13.57 Q2.5 12 3.38 10.43 L6.12 5.57 Q7 4 8.8 4 L15.2 4 Q17 4 17.88 5.57 L20.62 10.43 Q21.5 12 20.62 13.57 L17.88 18.43 Q17 20 15.2 20 L8.8 20 Q7 20 6.12 18.43Z"/><path d="m9.75 9 4.5 6"/></symbol>
</svg>
<div id="list"></div>
<script>
  const icons = [["i-home","Home"],["i-box","Mods"],["i-bell","Meldungen"],["i-hex","Einstellungen"]];
  const ideas = [
    [56,"Leise","graue Fläche, feiner Rand, sonst nichts"],
    [57,"Lichtfleck","Schein folgt der Maus über das Dock"],
    [58,"Magnet","Icon zieht leicht zur Maus hin"],
    [59,"Feder-Zoom","Icon springt größer und bleibt"],
    [60,"Glas-Kante","Glasfläche mit heller Oberkante"],
    [61,"Segment","grauer Block gleitet mit Feder, wie iOS"],
    [62,"Gleitstrich","grüner Strich gleitet unter das Icon"],
    [63,"Scharfstellen","Icon wird aus Unschärfe scharf"],
    [64,"Gestaffelt","andere dunkeln nacheinander ab"],
    [65,"Insel","Button öffnet sich wie Dynamic Island"],
    [66,"Neigung","Button kippt mit der Maus, 3D"],
    [67,"Erhoben","hebt sich mit Schatten und Lichtkante"],
    [68,"Fokus-Ring","heller Ring mit Abstand, wie Tastaturfokus"],
    [69,"Verlaufsrahmen","Rand läuft von Grün nach Nichts"],
    [70,"Kräftiger","Strich dicker, Icon minimal höher"],
    [71,"Warm","inaktiv kühl-grau, aktiv warm-weiß"],
    [72,"Tooltip","weißes Label erscheint darüber"],
    [73,"Geisterspur","Block gleitet, alte Position verblasst"],
    [74,"Taste","drückt sich kurz ein und federt raus"],
    [75,"Ladebalken","Strich läuft durch und bleibt unter dem Icon"],
  ];
  const extra = { 69: '<span class="gb"></span>' };
  const svg = (id) => `<svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
  const list = document.getElementById("list");
  for (const [v, name, sub] of ideas) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<div class="lab">${v} · ${name}<small>${sub}</small></div>`;
    const d = document.createElement("div"); d.className = "d d" + v;
    if (v === 61 || v === 73) d.innerHTML = '<span class="sl"></span>';
    if (v === 62) d.innerHTML = '<span class="ul"></span>';
    if (v === 75) d.innerHTML = '<span class="pb"></span>';
    const btns = icons.map(([id, label]) => {
      const b = document.createElement("button"); b.className = "b v" + v;
      b.innerHTML = `<span class="ic">${svg(id)}</span><span class="lb">${label}</span>` + (v === 72 ? `<span class="tt">${label}</span>` : "") + (extra[v] || "");
      d.appendChild(b); return b;
    });
    let cur = -1;
    const sel = (i) => {
      btns.forEach((b, j) => b.classList.toggle("on", j === i));
      const x = btns[i].offsetLeft;
      if (v === 61) d.querySelector(".sl").style.transform = `translateX(${x}px)`;
      if (v === 62) d.querySelector(".ul").style.transform = `translateX(${x + 15}px)`;
      if (v === 73) { const sl = d.querySelector(".sl"); if (cur !== -1) { const g = document.createElement("span"); g.className = "gh"; g.style.transform = sl.style.transform; d.appendChild(g); setTimeout(() => g.remove(), 500); } sl.style.transform = `translateX(${x}px)`; }
      if (v === 75) { const pb = d.querySelector(".pb"); if (cur !== -1) { pb.style.left = "10px"; pb.style.width = (d.clientWidth - 20) + "px"; setTimeout(() => { pb.style.left = (x + 15) + "px"; pb.style.width = "22px"; }, 280); } else { pb.style.left = (x + 15) + "px"; pb.style.width = "22px"; } }
      if ((v === 63 || v === 74) && cur !== -1) { const s = btns[i].querySelector(".ic"); s.style.animation = "none"; void s.offsetWidth; s.style.animation = ""; }
      cur = i;
    };
    btns.forEach((b, i) => b.addEventListener("click", () => sel(i)));
    if (v === 57) d.addEventListener("mousemove", (e) => btns.forEach((b) => { const r = b.getBoundingClientRect(); b.style.setProperty("--mx", (e.clientX - r.left) + "px"); b.style.setProperty("--my", (e.clientY - r.top) + "px"); }));
    if (v === 57) d.addEventListener("mouseleave", () => btns.forEach((b) => { b.style.removeProperty("--mx"); b.style.removeProperty("--my"); }));
    if (v === 58 || v === 66) btns.forEach((b) => {
      b.addEventListener("mousemove", (e) => { const r = b.getBoundingClientRect(); const dx = (e.clientX - r.left - r.width / 2) / r.width, dy = (e.clientY - r.top - r.height / 2) / r.height;
        if (v === 58) b.querySelector(".ic").style.transform = `translate(${dx * 8}px, ${dy * 8}px)`;
        else b.style.transform = `rotateY(${dx * 22}deg) rotateX(${-dy * 22}deg)`; });
      b.addEventListener("mouseleave", () => { if (v === 58) b.querySelector(".ic").style.transform = ""; else b.style.transform = ""; });
    });
    row.appendChild(d); list.appendChild(row);
    requestAnimationFrame(() => sel(0));
  }
</script>
</body>
</html>
