<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings · 20 layouts</title>
<script src="https://unpkg.com/skinview3d@3.1.0/bundles/skinview3d.bundle.js"></script>
<style>
  @font-face { font-family: "SmallCaps"; src: url("/fonts/smallcaps.ttf") format("truetype"); }
  @font-face { font-family: "MinecraftTen"; src: url("/fonts/minecraft.woff2") format("woff2"); }
  :root { --sc: "SmallCaps", monospace; --mc: "MinecraftTen", sans-serif; --ui: "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; background: #000; color: #fff; font-family: var(--sc); letter-spacing: .03em; }
  body { padding: 28px 24px 60px; }
  h1 { font-size: 15px; font-weight: 500; color: #888; margin: 0 0 6px; letter-spacing: .1em; }
  .note { font-family: var(--ui); font-size: 13px; color: #666; margin: 0 0 24px; letter-spacing: 0; }
  #grid { display: grid; grid-template-columns: repeat(2, 640px); gap: 30px 24px; }
  .lab { font-size: 15px; margin: 10px 0 0; }
  .lab small { display: block; color: #777; font-size: 12px; margin-top: 3px; font-family: var(--ui); letter-spacing: 0; max-width: 620px; }
  .frame { width: 640px; height: 400px; overflow: hidden; border: 1px solid #2a2a2a; }
  .win { position: relative; width: 1280px; height: 800px; background: #0a0a0a; transform: scale(.5); transform-origin: 0 0; overflow: hidden; }
  .abs { position: absolute; }
  .ui { font-family: var(--ui); letter-spacing: 0; }
  .muted { font-family: var(--ui); font-size: 13px; color: #777; letter-spacing: 0; }
  .box { background: #0c0c0c; border: 1px solid #2a2a2a; box-sizing: border-box; }
  .cap { font-size: 12px; letter-spacing: .14em; color: #777; text-transform: uppercase; }
  .h { font-size: 24px; letter-spacing: .08em; text-transform: uppercase; }
  .flex { display: flex; } .col { display: flex; flex-direction: column; } .center { align-items: center; } .between { justify-content: space-between; }

  /* previews */
  .pv { position: relative; display: block; background: #0a0a0a center / cover no-repeat; overflow: hidden; }
  .pv-grid { background-image: linear-gradient(#1f1f1f 1px, transparent 1px), linear-gradient(90deg, #1f1f1f 1px, transparent 1px); background-size: 16px 16px; }
  .pv-lightning { background-image: url(/previews/lightning.webp); }
  .pv-ascii { background-image: url(/previews/ascii.webp); }
  .pv-ghostfibers { background-image: url(/previews/ghostfibers.webp); }
  .full-ascii { background: #0a0a0a url(/previews/ascii.webp) center bottom / 100% 62% no-repeat; }
  .full-fibers { background: #050505 url(/previews/ghostfibers.webp) center / cover no-repeat; }
  .tile { position: relative; border: 1px solid #2a2a2a; box-sizing: border-box; background: #0c0c0c; }
  .tile.sel { border-color: #fff; box-shadow: inset 0 0 0 1px #fff; }
  .tile .pv { position: absolute; inset: 0; }
  .tile .nm { position: absolute; left: 12px; bottom: 10px; font-size: 13px; letter-spacing: .1em; text-shadow: 0 1px 4px #000; }
  .chk { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .chk svg { width: 13px; height: 13px; }

  /* controls */
  .sw { width: 24px; height: 24px; box-sizing: border-box; border: 1px solid #333; flex: none; }
  .sw.sel { outline: 2px solid #fff; outline-offset: 2px; }
  .sw.plus { border: 1px dashed #555; display: flex; align-items: center; justify-content: center; color: #aaa; font-family: var(--ui); font-size: 14px; }
  .sws { display: flex; gap: 8px; align-items: center; }
  .hue { position: relative; height: 12px; background: linear-gradient(90deg, #ff3b3b, #ffb23b, #e8ff3b, #3bff6a, #3bf5ff, #3b6aff, #b03bff, #ff3bb0, #ff3b3b); flex: none; }
  .hue b { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 0 1px #000; }
  .slider { position: relative; height: 2px; background: #333; flex: none; }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  .slider b { position: absolute; top: -6px; width: 14px; height: 14px; margin-left: -7px; background: #fff; }
  .tg { width: 44px; height: 24px; border: 1px solid #444; background: #141414; position: relative; box-sizing: border-box; flex: none; }
  .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #666; }
  .tg.on { border-color: #fff; background: #1a1a1a; } .tg.on::after { left: 23px; background: #fff; }
  .seg { display: flex; border: 1px solid #2a2a2a; } .seg span { padding: 9px 14px; font-size: 13px; letter-spacing: .08em; color: #777; } .seg span + span { border-left: 1px solid #2a2a2a; } .seg span.on { background: #1a1a1a; color: #fff; }
  .val { font-family: var(--ui); font-size: 13px; color: #ddd; letter-spacing: 0; }
  .mcv { font-family: var(--mc); font-size: 12px; color: #aaa; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 20px; }
  .row + .row { border-top: 1px solid #1c1c1c; }
  .rt b { display: block; font-weight: normal; font-size: 14px; letter-spacing: .08em; } .rt span { font-family: var(--ui); font-size: 12px; color: #666; letter-spacing: 0; }
  .tab { position: relative; font-size: 20px; letter-spacing: .08em; color: #555; padding-bottom: 10px; }
  .tab.on { color: #fff; } .tab.on::after { content: ""; position: absolute; left: 0; bottom: 0; width: 22px; height: 2px; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.35); }
  .pill { padding: 8px 16px; font-size: 13px; letter-spacing: .1em; color: #888; } .pill.on { background: #fff; color: #000; }
  .glass { background: rgba(14,14,14,.55); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.1); box-sizing: border-box; }
  .ico { width: 20px; height: 20px; } .ico svg { width: 20px; height: 20px; }
  .mcb { height: 40px; box-sizing: border-box; background: #6f6f6f; border: 2px solid #000; box-shadow: inset 2px 2px 0 #a8a8a8, inset -2px -2px 0 #3e3e3e; display: flex; align-items: center; justify-content: center; font-family: var(--mc); font-size: 15px; text-shadow: 2px 2px 0 #3f3f3f; }
  .mcb.hv { background: #7e8fbf; box-shadow: inset 2px 2px 0 #b9c4e6, inset -2px -2px 0 #4a5683; }
  img.skin { position: absolute; }

  /* chrome */
  .notch { position: absolute; top: 0; right: 0; width: 150px; height: 46px; background: #2a2a2a; clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%); z-index: 9; }
  .notch .in { position: absolute; inset: 0 0 1px 1px; background: #0c0c0c; clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%); display: flex; justify-content: flex-end; align-items: center; gap: 4px; padding-right: 8px; }
  .notch .in span { width: 38px; height: 32px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; } .notch svg { width: 17px; height: 17px; }
  .dock { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; gap: 8px; padding: 10px; background: #0c0c0c; border: 1px solid #2a2a2a; z-index: 8; }
  .di { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; color: #777; position: relative; }
  .di svg { width: 22px; height: 22px; } .di.on { color: #fff; } .di.on::after { content: ""; position: absolute; left: 15px; right: 15px; bottom: 7px; height: 2px; background: #fff; }
  .launch { display: flex; margin: 0 12px; border: 1px solid #555; background: #1a1a1a; }
  .launch .lm { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0 32px 0 20px; min-width: 200px; height: 52px; box-sizing: border-box; }
  .launch .lt { font-size: 22px; line-height: 1; letter-spacing: .05em; } .launch .ls { font-family: var(--mc); font-size: 11px; color: #9a9a9a; }
  .launch .la { width: 52px; display: flex; align-items: center; justify-content: center; color: #bbb; border-left: 1px solid #555; } .launch .la svg { width: 20px; height: 20px; }
  .launch .tl { width: 52px; display: flex; align-items: center; justify-content: center; padding-left: 4px; }
  .face { width: 32px; height: 32px; image-rendering: pixelated; background: url(skin.png) -32px -32px / 256px 256px; position: relative; flex: none; }
  .face::after { content: ""; position: absolute; inset: 0; background: url(skin.png) -160px -32px / 256px 256px; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>Settings · 20 layouts · full window at 50 %</h1>
<p class="note">Same content everywhere: backgrounds, color (presets, custom, rainbow), moving grid, memory, when the game starts, loader, version. All in the launcher's square black style.</p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="home" viewBox="0 0 24 24"><path d="M9.90 4.53Q12.00 3.00 14.10 4.53L19.03 8.11Q21.13 9.63 20.33 12.11L18.45 17.89Q17.64 20.37 15.04 20.37L8.96 20.37Q6.36 20.37 5.55 17.89L3.67 12.11Q2.87 9.63 4.97 8.11Z"/><path d="M10 15.5q2 1.5 4 0"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path d="M10.9 3.4 Q12 2.8 13.1 3.4 L19.2 6.85 Q20.3 7.5 20.3 8.75 L20.3 15.25 Q20.3 16.5 19.2 17.15 L13.1 20.6 Q12 21.2 10.9 20.6 L4.8 17.15 Q3.7 16.5 3.7 15.25 L3.7 8.75 Q3.7 7.5 4.8 6.85Z"/><path d="M4 7.5 12 12 20 7.5"/><path d="M12 12v9"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 10.5a6 6 0 0 1 12 0v3.9c0 .7.3 1.3.9 1.7l.6.4c.9.6.5 1.9-.6 1.9H5.1c-1.1 0-1.5-1.3-.6-1.9l.6-.4c.6-.4.9-1 .9-1.7z"/><path d="M10 20.5q2 1.4 4 0"/></symbol>
  <symbol id="hex" viewBox="0 0 24 24"><path d="M3.38 13.57 Q2.5 12 3.38 10.43 L6.12 5.57 Q7 4 8.8 4 L15.2 4 Q17 4 17.88 5.57 L20.62 10.43 Q21.5 12 20.62 13.57 L17.88 18.43 Q17 20 15.2 20 L8.8 20 Q7 20 6.12 18.43Z"/><path d="m9.75 9 4.5 6"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="sq" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
  <symbol id="cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.5 0-1.3-1-1.5-1-2.5S13.3 15 14.5 15H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></symbol>
</svg>
<div id="grid"></div>
<canvas id="src" style="display:none"></canvas>
<script>
  const sv = (id, sw = 1.75) => `<svg fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
  const BGS = [["grid", "Grid"], ["lightning", "Lightning"], ["ascii", "ASCII"], ["ghostfibers", "Ghost fibers"]];
  const SEL = "ascii";
  const COLORS = ["#16222e", "#1f1633", "#0f2a1f", "#2a1818", "#2a2410", "#89cff0"];
  const chk = `<span class="chk">${sv("check", 3)}</span>`;
  const notch = `<div class="notch"><div class="in"><span>${sv("min")}</span><span>${sv("sq")}</span><span>${sv("x")}</span></div></div>`;
  const dock = `<div class="dock"><span class="di">${sv("home")}</span><span class="di">${sv("box")}</span><span class="launch"><span class="tl"><span class="face"></span></span><span class="lm"><span class="lt">LAUNCH</span><span class="ls">Survival · 26.3</span></span><span class="la">${sv("chev")}</span></span><span class="di">${sv("bell")}</span><span class="di on">${sv("hex")}</span></div>`;
  const skin = (x, y, w = 300, h = 400) => `<img class="skin" data-skin alt="" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">`;
  const tile = (id, nm, h, extra = "") => `<div class="tile${id === SEL ? " sel" : ""}" style="height:${h}px;${extra}"><span class="pv pv-${id}"></span>${id === SEL ? chk : ""}<span class="nm">${nm.toUpperCase()}</span></div>`;
  const tiles = (cols, h, gap = 12, style = "") => `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:${gap}px;${style}">${BGS.map(([id, nm]) => tile(id, nm, h)).join("")}</div>`;
  const sws = (size = 24, gap = 8, plus = true) => `<div class="sws" style="gap:${gap}px">${COLORS.map((c, i) => `<span class="sw${i === 5 ? " sel" : ""}" style="width:${size}px;height:${size}px;background:${c}"></span>`).join("")}${plus ? `<span class="sw plus" style="width:${size}px;height:${size}px">+</span>` : ""}</div>`;
  const hue = (w = 120) => `<span class="hue" style="width:${w}px"><b style="left:54%"></b></span>`;
  const colorRow = (w = 120) => `<div class="flex center" style="gap:16px">${sws()}${hue(w)}</div>`;
  const slider = (w = 200, p = 14) => `<span class="slider" style="width:${w}px"><i style="width:${p}%"></i><b style="left:${p}%"></b></span>`;
  const mem = (w = 220) => `<div class="flex center" style="gap:14px">${slider(w)}<span class="val">4 GB</span></div>`;
  const after = `<div class="seg"><span class="on">KEEP OPEN</span><span>MINIMIZE</span></div>`;
  const row = (t, s, ctl) => `<div class="row"><div class="rt"><b>${t}</b><span>${s}</span></div>${ctl}</div>`;
  const gameRows = (memW = 220) => row("MEMORY", "How much RAM Minecraft may use", mem(memW)) + row("WHEN THE GAME STARTS", "What the launcher does while you play", after) + row("MOD LOADER", "Every instance runs on Fabric", `<span class="mcv">Fabric</span>`) + row("LAUNCHER VERSION", "Updates install from the top left", `<span class="mcv">0.1.3</span>`);
  const tabs = (a = 0, size = 20) => `<div class="flex" style="gap:28px">${["BACKGROUND", "GAME", "ABOUT"].map((t, i) => `<span class="tab${i === a ? " on" : ""}" style="font-size:${size}px">${t}</span>`).join("")}</div>`;

  const ideas = [
    ["1 · Bento", "One page, no tabs: a big tile shows the chosen background, smaller tiles around it hold color, memory and the rest. Everything visible at a glance.",
      "", notch + `<div class="abs" style="left:80px;right:80px;top:64px;bottom:140px;display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:12px">
        <div class="tile sel" style="grid-row:span 2"><span class="pv pv-ascii"></span>${chk}<span class="nm" style="font-size:18px">ASCII</span></div>
        ${["grid", "lightning", "ghostfibers"].map((id) => `<div class="tile"><span class="pv pv-${id}"></span><span class="nm">${BGS.find((b) => b[0] === id)[1].toUpperCase()}</span></div>`).join("")}
        <div class="box col" style="padding:16px;gap:12px;justify-content:center"><span class="cap">Color</span>${sws(22, 6)}${hue(200)}</div>
        <div class="box col" style="padding:16px;gap:10px;justify-content:center"><span class="cap">Memory</span><span style="font-family:var(--mc);font-size:30px">4 GB</span>${slider(200)}</div>
        <div class="box col" style="padding:16px;gap:12px;justify-content:center"><span class="cap">When the game starts</span>${after}</div>
        <div class="box col" style="padding:16px;gap:8px;justify-content:center"><span class="cap">Loader · Version</span><span class="mcv" style="font-size:16px;color:#fff">Fabric · 0.1.3</span></div>
      </div>` + dock],
    ["2 · Inspector", "Background gallery left, an inspector panel right that shows the options of the selected background, like in design tools. Game settings below it.",
      "", notch + `<div class="abs flex" style="left:80px;right:80px;top:64px;bottom:140px;gap:16px">
        <div class="col" style="flex:1;gap:16px">${tabs(0)}${tiles(2, 150)}</div>
        <div class="box col" style="width:340px;padding:20px;gap:18px"><span class="cap">ASCII</span><div class="tile" style="height:120px"><span class="pv pv-ascii"></span></div><span class="cap">Color</span>${sws(24, 8)}${hue(296)}<div style="height:1px;background:#1c1c1c"></div><span class="cap">Memory</span>${mem(220)}<span class="cap">When the game starts</span>${after}</div>
      </div>` + dock],
    ["3 · Search first", "A search field on top (Ctrl+K), results grouped below. Scales well once there are many settings.",
      "", notch + `<div class="abs col" style="left:50%;transform:translateX(-50%);top:70px;width:820px;gap:16px">
        <div class="box flex center" style="height:52px;padding:0 18px;gap:12px"><span class="ico" style="color:#888">${sv("search")}</span><span class="muted" style="font-size:15px">Search settings…</span><span style="margin-left:auto" class="mcv">Ctrl K</span></div>
        <span class="cap">Background</span>${tiles(4, 92, 10)}<div class="flex center between" style="gap:16px"><span class="cap">Color</span>${colorRow(160)}</div>
        <span class="cap" style="margin-top:6px">Game</span><div class="box">${row("MEMORY", "How much RAM Minecraft may use", mem(200)) + row("WHEN THE GAME STARTS", "What the launcher does while you play", after)}</div>
      </div>` + dock],
    ["4 · Side sheet", "Settings slide in from the right over the home screen; the player and the live background stay visible on the left.",
      "full-ascii", skin(170, 190) + `<div class="abs" style="left:270px;top:150px;transform:translateX(-50%);font-family:var(--mc);font-size:24px;text-shadow:2px 2px 0 #3f3f3f">offup</div>` + `<div class="abs box col" style="right:0;top:0;bottom:0;width:560px;border-width:0 0 0 1px;padding:70px 32px 30px;gap:18px">${tabs(0)}${tiles(2, 120)}<span class="cap">Color</span>${colorRow(150)}</div>` + notch + dock.replace('class="dock"', 'class="dock" style="left:360px"')],
    ["5 · Showroom", "One big live preview, thumbnails underneath like a store, the color row right below. Game settings on their own tab.",
      "", notch + `<div class="abs col" style="left:110px;right:110px;top:64px;gap:14px">${tabs(0)}<div class="tile sel" style="height:300px"><span class="pv pv-ascii"></span>${chk}<span class="nm" style="font-family:var(--mc);font-size:28px;left:22px;bottom:18px;letter-spacing:0">ASCII</span></div>
        <div class="flex between center"><div class="flex" style="gap:10px">${BGS.map(([id]) => `<div class="tile${id === SEL ? " sel" : ""}" style="width:120px;height:68px"><span class="pv pv-${id}"></span></div>`).join("")}</div>${colorRow(140)}</div></div>` + dock],
    ["6 · Masonry cards", "Each topic is its own card in two columns: Background, Color, Game, About. Calm and very readable.",
      "", notch + `<div class="abs" style="left:110px;right:110px;top:64px;bottom:140px;display:grid;grid-template-columns:1.3fr 1fr;gap:14px">
        <div class="box col" style="padding:20px;gap:14px;grid-row:span 2"><span class="h" style="font-size:18px">Background</span>${tiles(2, 118, 10)}</div>
        <div class="box col" style="padding:20px;gap:14px"><span class="h" style="font-size:18px">Color</span>${sws(26, 8)}${hue(330)}</div>
        <div class="box col" style="padding:20px;gap:16px"><span class="h" style="font-size:18px">Game</span><div class="flex between center"><span class="cap">Memory</span>${mem(160)}</div><div class="flex between center"><span class="cap">After launch</span>${after}</div></div>
      </div>` + dock],
    ["7 · Grouped list", "Clean rows with values on the right, like system settings. Backgrounds as a compact strip in the first group.",
      "", notch + `<div class="abs col" style="left:50%;transform:translateX(-50%);top:64px;width:760px;gap:14px">${tabs(0)}
        <div class="box"><div class="row" style="padding:14px 20px"><div class="rt"><b>BACKGROUND</b><span>Shown behind the player</span></div><div class="flex" style="gap:8px">${BGS.map(([id]) => `<div class="tile${id === SEL ? " sel" : ""}" style="width:76px;height:44px"><span class="pv pv-${id}"></span></div>`).join("")}</div></div>${row("COLOR", "Tint of the effect", colorRow(110))}${row("MOVING GRID", "Only for Grid", `<span class="tg"></span>`)}</div>
        <div class="box">${row("MEMORY", "How much RAM Minecraft may use", mem(200))}${row("WHEN THE GAME STARTS", "What the launcher does while you play", after)}</div>
      </div>` + dock],
    ["8 · Icon rail", "A slim icon rail on the left (Background, Game, About), content to the right. Room for more sections later without clutter.",

  const q = new URLSearchParams(location.search);
  const row_ = Number(q.get("row") || 0);
  const shown = row_ ? ideas.slice((row_ - 1) * 2, row_ * 2) : ideas;
  const grid = document.getElementById("grid");
  for (const [t, s, bg, html] of shown) {
    const c = document.createElement("div");

  }

    const canvas = document.getElementById("src");

    await viewer.loadSkin("skin.png");
    viewer.zoom = 0.78;
    viewer.playerWrapper.rotation.y = -0.55;
    viewer.render();
    const url = canvas.toDataURL();
    for (const img of document.querySelectorAll("img[data-skin]")) img.src = url;
  })();
