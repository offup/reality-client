<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Window controls · 20 ideas</title>
<script src="https://unpkg.com/skinview3d@3.1.0/bundles/skinview3d.bundle.js"></script>
<style>
  @font-face { font-family: "SmallCaps"; src: url("/fonts/smallcaps.ttf") format("truetype"); }
  @font-face { font-family: "MinecraftTen"; src: url("/fonts/minecraft.woff2") format("woff2"); }
  :root { --sc: "SmallCaps", monospace; --mc: "MinecraftTen", sans-serif; --ui: "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; background: #000; color: #fff; font-family: var(--sc); letter-spacing: .03em; }
  body { padding: 28px 24px 64px; }
  h1 { font-size: 15px; font-weight: 500; color: #888; margin: 0 0 24px; letter-spacing: .1em; }
  #grid { display: grid; grid-template-columns: repeat(2, 640px); gap: 30px 24px; }
  .lab { font-size: 15px; margin: 10px 0 0; }
  .lab small { display: block; color: #777; font-size: 12px; margin-top: 3px; font-family: var(--ui); letter-spacing: 0; }
  .frame { width: 640px; height: 400px; overflow: hidden; border: 1px solid #2a2a2a; }
  .win { position: relative; width: 1280px; height: 800px; background: #0a0a0a; transform: scale(.5); transform-origin: 0 0; overflow: hidden; }
  .win::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(#161616 1px, transparent 1px), linear-gradient(90deg, #161616 1px, transparent 1px); background-size: 40px 40px; -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 45%, #000 20%, transparent 100%); }
  img.skin { position: absolute; left: 50%; top: 160px; transform: translateX(-50%); width: 340px; height: 450px; }
  .name { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); font-family: var(--mc); font-size: 24px; text-shadow: 2px 2px 0 #3f3f3f; }
  .dock { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; align-items: stretch; gap: 8px; padding: 10px; background: #0c0c0c; border: 1px solid #2a2a2a; z-index: 3; }
  .dock .it { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; color: #777; position: relative; }
  .dock .it.on { color: #fff; } .dock svg { width: 22px; height: 22px; }
  .dock .ul { position: absolute; left: 15px; bottom: 7px; width: 22px; height: 2px; background: #fff; }
  .dock .lg { display: flex; margin: 0 12px; border: 1px solid #555; background: #1a1a1a; }
  .dock .lm { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 200px; padding: 0 32px 0 20px; height: 52px; box-sizing: border-box; }
  .dock .lt { font-size: 22px; line-height: 1; } .dock .ls { font-family: var(--mc); font-size: 11px; color: #9a9a9a; }
  .dock .la { width: 52px; display: flex; align-items: center; justify-content: center; color: #bbb; border-left: 1px solid #555; }
  .dock .tile { width: 52px; display: flex; align-items: center; justify-content: center; padding-left: 4px; }
  .face { width: 32px; height: 32px; image-rendering: pixelated; background: url(skin.png) -32px -32px / 256px 256px; position: relative; }
  .face::after { content: ""; position: absolute; inset: 0; background: url(skin.png) -160px -32px / 256px 256px; image-rendering: pixelated; }
  .dock .sep { width: 1px; background: #2a2a2a; margin: 6px 4px; }
  .dock .wc { width: 40px; display: flex; align-items: center; justify-content: center; color: #777; } .dock .wc svg { width: 18px; height: 18px; } .dock .wc.x { color: #bbb; }

  .box { position: absolute; display: flex; gap: 8px; padding: 8px; background: #0c0c0c; border: 1px solid #2a2a2a; z-index: 4; }
  .box .b { width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; color: #999; border: 1px solid transparent; }
  .box .b svg { width: 18px; height: 18px; } .box .b.hot { color: #fff; background: #e24b4a; } .box .b.hv { color: #fff; background: #1c1c1c; border-color: #333; }
  .tr { right: 24px; top: 24px; } .tl { left: 24px; top: 24px; }
  .menu { position: absolute; background: #0f0f0f; border: 1px solid #2e2e2e; box-shadow: 0 16px 40px rgba(0,0,0,.7); padding: 6px; z-index: 6; min-width: 220px; }
  .menu .r { display: flex; align-items: center; gap: 12px; padding: 10px 12px; font-family: var(--ui); font-size: 15px; letter-spacing: 0; color: #ddd; }
  .menu .r svg { width: 18px; height: 18px; color: #999; } .menu .r.hv { background: #1c1c1c; } .menu .r .k { margin-left: auto; color: #555; font-size: 12px; }
  .menu .r.red { color: #f0a0a0; } .menu .r.red svg { color: #e24b4a; } .menu .s { height: 1px; background: #222; margin: 4px 0; }
  .logo { position: absolute; left: 28px; top: 26px; display: flex; align-items: center; gap: 12px; z-index: 4; }
  .logo img { width: 38px; height: 38px; } .logo span { font-size: 17px; letter-spacing: .08em; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 44px; background: #0c0c0c; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; padding: 0 0 0 16px; z-index: 4; }
  .bar .t { font-size: 15px; letter-spacing: .08em; color: #bbb; display: flex; align-items: center; gap: 10px; } .bar .t img { width: 22px; height: 22px; }
  .bar .sp { flex: 1; } .bar .b { width: 52px; height: 44px; display: flex; align-items: center; justify-content: center; color: #999; } .bar .b svg { width: 16px; height: 16px; } .bar .b.hot { background: #e24b4a; color: #fff; }
  .hint { position: absolute; font-family: var(--ui); font-size: 15px; color: #777; letter-spacing: 0; z-index: 4; }
  .cursor { position: absolute; width: 0; height: 0; border-left: 10px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; transform: rotate(-30deg); z-index: 9; filter: drop-shadow(0 1px 1px #000); }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); z-index: 5; }
  .pause { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: flex; flex-direction: column; gap: 12px; width: 420px; z-index: 6; }
  .pause .ttl { font-family: var(--mc); font-size: 30px; text-align: center; margin-bottom: 14px; text-shadow: 2px 2px 0 #3f3f3f; }
  .pause .pb { height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #555; background: #1a1a1a; font-size: 20px; letter-spacing: .06em; }
  .pause .pb.red { border-color: #6b2a2a; color: #f0a0a0; } .pause .row { display: flex; gap: 12px; } .pause .row .pb { flex: 1; font-size: 17px; }
  .ring { position: absolute; right: 30px; top: 30px; width: 56px; height: 56px; z-index: 5; }
  .pill { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: #0c0c0c; border: 1px solid #2a2a2a; z-index: 5; }
  .pill .b { width: 40px; height: 32px; display: flex; align-items: center; justify-content: center; color: #999; } .pill .b svg { width: 16px; height: 16px; } .pill .b.hot { color: #fff; background: #e24b4a; }
  .pill .nm { padding: 0 14px; font-size: 14px; letter-spacing: .08em; color: #bbb; border-right: 1px solid #2a2a2a; margin-right: 4px; }
  .strip { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #0c0c0c; border: 1px solid #2a2a2a; border-right: 0; z-index: 4; }
  .strip .b { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #999; } .strip .b svg { width: 18px; height: 18px; } .strip .b.hot { color: #fff; background: #e24b4a; }
  .toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: #0f0f0f; border: 1px solid #2e2e2e; box-shadow: 0 16px 40px rgba(0,0,0,.7); font-family: var(--ui); font-size: 15px; letter-spacing: 0; z-index: 6; white-space: nowrap; }
  .toast .bt { padding: 8px 14px; border: 1px solid #444; font-family: var(--sc); font-size: 14px; letter-spacing: .06em; } .toast .bt.red { border-color: #6b2a2a; color: #f0a0a0; }
  .tray { position: absolute; right: 0; bottom: 0; left: 0; height: 48px; background: #1b1b1f; border-top: 1px solid #333; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 24px; z-index: 7; font-family: var(--ui); font-size: 13px; color: #ccc; letter-spacing: 0; }
  .tray img { width: 22px; height: 22px; outline: 1px solid #555; outline-offset: 4px; }
  .edge { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, transparent, #555, transparent); z-index: 4; }
</style>
</head>
<body>
<h1>Window controls · minimize, maximize, close · 20 ideas · full window at 50 %</h1>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M9.90 4.53Q12.00 3.00 14.10 4.53L19.03 8.11Q21.13 9.63 20.33 12.11L18.45 17.89Q17.64 20.37 15.04 20.37L8.96 20.37Q6.36 20.37 5.55 17.89L3.67 12.11Q2.87 9.63 4.97 8.11Z"/><path d="M10 15.5q2 1.5 4 0"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M10.9 3.4 Q12 2.8 13.1 3.4 L19.2 6.85 Q20.3 7.5 20.3 8.75 L20.3 15.25 Q20.3 16.5 19.2 17.15 L13.1 20.6 Q12 21.2 10.9 20.6 L4.8 17.15 Q3.7 16.5 3.7 15.25 L3.7 8.75 Q3.7 7.5 4.8 6.85Z"/><path d="M4 7.5 12 12 20 7.5"/><path d="M12 12v9"/><path d="m8 5.2 8 4.5"/><path d="m6.6 11.3 2.4 1.35"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10.5a6 6 0 0 1 12 0v3.9c0 .7.3 1.3.9 1.7l.6.4c.9.6.5 1.9-.6 1.9H5.1c-1.1 0-1.5-1.3-.6-1.9l.6-.4c.6-.4.9-1 .9-1.7z"/><path d="M10 20.5q2 1.4 4 0"/></symbol>
  <symbol id="i-hex" viewBox="0 0 24 24"><path d="M3.38 13.57 Q2.5 12 3.38 10.43 L6.12 5.57 Q7 4 8.8 4 L15.2 4 Q17 4 17.88 5.57 L20.62 10.43 Q21.5 12 20.62 13.57 L17.88 18.43 Q17 20 15.2 20 L8.8 20 Q7 20 6.12 18.43Z"/><path d="m9.75 9 4.5 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-tray" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
</svg>
<div id="grid"></div>
<canvas id="src" style="display:none"></canvas>
<script>
  const sv = (id) => `<svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
  const base = (extraDock = "", dockLeft = "") => `<div class="name">offup</div><img class="skin" data-skin alt="">
    <div class="dock">${dockLeft}<div class="it on">${sv("i-home")}<span class="ul"></span></div><div class="it">${sv("i-box")}</div>
    <div class="lg"><div class="tile"><span class="face"></span></div><div class="lm"><span class="lt">Launch</span><span class="ls">1.21.4</span></div><div class="la">${sv("i-chev")}</div></div>
    <div class="it">${sv("i-bell")}</div><div class="it">${sv("i-hex")}</div>${extraDock}</div>`;
  const trio = (cls, hot) => `<div class="box ${cls}"><span class="b${hot === 0 ? " hv" : ""}">${sv("i-min")}</span><span class="b${hot === 1 ? " hv" : ""}">${sv("i-max")}</span><span class="b${hot === 2 ? " hot" : ""}">${sv("i-x")}</span></div>`;
  const cursor = (x, y) => `<span class="cursor" style="left:${x}px;top:${y}px"></span>`;
  const logo = `<div class="logo"><img src="logo.png" alt=""><span>Reality Client</span></div>`;
  const menu = (x, y, extra = "") => `<div class="menu" style="left:${x}px;top:${y}px">${extra}<div class="r hv">${sv("i-min")}Minimize<span class="k">Win+↓</span></div><div class="r">${sv("i-full")}Fullscreen<span class="k">F11</span></div><div class="s"></div><div class="r red">${sv("i-power")}Quit<span class="k">Alt+F4</span></div></div>`;
  const ideas = [
    ["1 · Corner trio", "Three square buttons top right in dock style, always visible. Close turns red on hover.", base() + trio("tr", 2) + cursor(1214, 46)],
    ["2 · Corner trio on hover", "Same three, but hidden until the mouse nears the top edge. A faint line marks the hot zone.", base() + `<div class="edge"></div>` + trio("tr") + cursor(1140, 14)],
    ["3 · In the dock", "Minimize and close as a small segment at the right end of the dock, after a divider.", base(`<span class="sep"></span><span class="wc">${sv("i-min")}</span><span class="wc x">${sv("i-x")}</span>`)],
    ["4 · Power button in the dock", "One power icon at the dock's end; click opens a menu with Minimize, Fullscreen, Quit.", base(`<span class="sep"></span><span class="wc x" style="color:#fff">${sv("i-power")}</span>`) + menu(860, 520)],
    ["5 · Top-left squares", "Like macOS, but our square language: three small squares next to nothing else, colors only on hover.", base() + `<div class="box tl" style="gap:10px;padding:10px"><span style="width:14px;height:14px;background:#e24b4a"></span><span style="width:14px;height:14px;background:#f5b041"></span><span style="width:14px;height:14px;background:#4ade80"></span></div>`],
    ["6 · Thin title bar", "A slim 44px bar in dock style across the top with logo, name and the three buttons. Classic and clear.", `<div class="bar"><span class="t"><img src="logo.png" alt="">Reality Client</span><span class="sp"></span><span class="b">${sv("i-min")}</span><span class="b">${sv("i-max")}</span><span class="b hot">${sv("i-x")}</span></div>` + base()],
    ["7 · Logo menu", "Click the clover top left: a menu with Minimize, Fullscreen, Quit. Nothing else on screen.", base() + logo + menu(28, 80) + cursor(50, 46)],
    ["8 · Island", "A small pill at the top center with the name and the buttons, appears on hover like a Dynamic Island.", base() + `<div class="pill"><span class="nm">REALITY</span><span class="b">${sv("i-min")}</span><span class="b">${sv("i-max")}</span><span class="b hot">${sv("i-x")}</span></div>`],
    ["9 · Esc pause menu", "Press Esc: the screen dims and a Minecraft-style menu appears: Back, Settings, Minimize, Quit.", base() + `<div class="dim"></div><div class="pause"><div class="ttl">Menu</div><div class="pb">Back to launcher</div><div class="row"><div class="pb">Settings</div><div class="pb">Minimize</div></div><div class="pb red">Quit</div></div>`],
    ["10 · Hold to close", "The X fills a ring while you hold it; release early and nothing happens. No accidental closing.", base() + `<svg class="ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="2"/><circle cx="28" cy="28" r="25" fill="none" stroke="#e24b4a" stroke-width="3" stroke-dasharray="157" stroke-dashoffset="55" transform="rotate(-90 28 28)"/><path d="M21 21l14 14M35 21L21 35" stroke="#fff" stroke-width="2"/></svg>` + `<span class="hint" style="right:100px;top:46px">Hold to close</span>`],
    ["11 · Right-click menu", "Right-click on empty space opens the window menu where you clicked.", base() + menu(260, 220) + cursor(258, 216)],
    ["12 · Right edge strip", "A narrow vertical strip on the right edge with the three buttons, out of the way of everything.", base() + `<div class="strip"><span class="b">${sv("i-min")}</span><span class="b">${sv("i-max")}</span><span class="b hot">${sv("i-x")}</span></div>`],
    ["13 · Only an X", "Just one quiet X top right; minimize via Win+↓ or double-click, maximize not offered at all.", base() + `<div class="box tr" style="padding:6px"><span class="b">${sv("i-x")}</span></div>`],
    ["14 · Text glyphs", "No boxes, just thin — and × in the corner, white on hover. The most minimal option.", base() + `<span class="hint" style="right:76px;top:22px;font-size:26px;color:#888">—</span><span class="hint" style="right:32px;top:18px;font-size:30px;color:#fff">×</span>`],
    ["15 · Confirm while playing", "Closing while Minecraft runs asks first, as a toast above the dock: keep playing or close both.", base() + trio("tr", 2) + `<div class="toast">Minecraft is still running.<span class="bt">Keep open</span><span class="bt red">Close both</span></div>`],
    ["16 · Close to tray", "X hides the launcher to the tray; the tray icon menu has Open and Quit. Good while a game runs.", base() + trio("tr", 2) + `<div class="tray">Reality Client is still running in the tray<img src="logo.png" alt=""></div>` + menu(980, 520, "")],
    ["17 · Account menu", "Window actions live in the account panel above the plus/face: Sign out, Minimize, Quit.", base() + `<div class="menu" style="left:390px;top:500px;min-width:300px"><div class="r">${sv("i-out")}Sign out</div><div class="s"></div><div class="r hv">${sv("i-min")}Minimize</div><div class="r red">${sv("i-power")}Quit</div></div>`],
    ["18 · Focus mode", "Maximize becomes \"Focus\": fullscreen, dock and name fade, only the player and background remain.", `<img class="skin" data-skin alt="" style="top:110px;width:420px;height:560px"><span class="hint" style="left:50%;bottom:40px;transform:translateX(-50%)">Esc to leave focus mode</span>` + `<div class="box tr" style="padding:6px"><span class="b hv">${sv("i-full")}</span></div>`],
    ["19 · Settings footer", "Quit and Minimize live at the bottom of the settings sidebar, where the version is now.", `<div class="box" style="left:80px;top:72px;width:260px;height:580px;flex-direction:column;justify-content:flex-end;padding:10px"><span class="menu" style="position:static;box-shadow:none;border:0;padding:0"><div class="r">${sv("i-min")}Minimize</div><div class="r red">${sv("i-power")}Quit</div></span></div>` + base()],
    ["20 · Dots menu", "A three-dot button top right; opens the same window menu plus About and Check for updates.", base() + `<div class="box tr" style="padding:6px"><span class="b hv">${sv("i-dots")}</span></div>` + `<div class="menu" style="right:24px;top:80px"><div class="r">About</div><div class="r">Check for updates</div><div class="s"></div><div class="r hv">${sv("i-min")}Minimize</div><div class="r">${sv("i-full")}Fullscreen</div><div class="r red">${sv("i-power")}Quit</div></div>`],
  ];
  const grid = document.getElementById("grid");
  for (const [t, s, html] of ideas) {
    const c = document.createElement("div");
    c.innerHTML = `<div class="frame"><div class="win">${html}</div></div><div class="lab">${t}<small>${s}</small></div>`;
    grid.appendChild(c);
  }
  (async () => {
    const canvas = document.getElementById("src");
    const viewer = new skinview3d.SkinViewer({ canvas, width: 680, height: 900, preserveDrawingBuffer: true });
    await viewer.loadSkin("skin.png");
    viewer.zoom = 0.78;
    viewer.playerWrapper.rotation.y = -0.55;
    viewer.render();
    const url = canvas.toDataURL();
    for (const img of document.querySelectorAll("img[data-skin]")) img.src = url;
  })();
</script>
</body>
</html>
