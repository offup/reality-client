# Builds the Linux app (AppImage for every distribution incl. Arch, plus a .deb) for every version tag.
# The release script downloads the result and publishes it together with Windows and macOS.
# Ubuntu 22.04 on purpose: an older glibc means the AppImage also runs on older systems.
name: Linux build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or branch to build (e.g. v0.1.5 or main)"
        required: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          # Keep compiled dependencies even when the app itself fails to build
          cache-on-failure: true

      - run: npm ci

      - name: Build
        run: npm run tauri build -- --bundles appimage,deb
        env:
          # Signs the update so installed launchers accept it
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Faster build: skip the slow whole-program optimization (app gets slightly bigger)
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
